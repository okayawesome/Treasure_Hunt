<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690" font-family="Helvetica, Arial, sans-serif">
<title>Treasure hunt class diagram</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="690" fill="#FFFFFF"/>
<style>
  .th { font-size: 14px; font-weight: bold; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #444441; }
  .div { stroke: #888780; stroke-width: 1; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>

<!-- Place -->
<rect x="70" y="40" width="240" height="190" rx="4" fill="#E6F1FB" stroke="#185FA5"/>
<text class="th" x="190" y="62" text-anchor="middle">Place</text>
<line class="div" x1="70" y1="76" x2="310" y2="76"/>
<text class="ts" x="82" y="100">name: str</text>
<text class="ts" x="82" y="120">description: str</text>
<text class="ts" x="82" y="140">item: Item | None</text>
<text class="ts" x="82" y="160">chest: Chest | None</text>
<line class="div" x1="70" y1="172" x2="310" y2="172"/>
<text class="ts" x="82" y="194">__init__(...)</text>
<text class="ts" x="82" y="214">visit(player) → True</text>

<!-- Player -->
<rect x="390" y="40" width="240" height="190" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
<text class="th" x="510" y="62" text-anchor="middle">Player</text>
<line class="div" x1="390" y1="76" x2="630" y2="76"/>
<text class="ts" x="402" y="100">name: str</text>
<text class="ts" x="402" y="120">bag: list[str]  (item names)</text>
<line class="div" x1="390" y1="132" x2="630" y2="132"/>
<text class="ts" x="402" y="154">__init__(name)</text>
<text class="ts" x="402" y="174">has(item_name) → bool</text>
<text class="ts" x="402" y="194">collect(item) → bool</text>
<text class="ts" x="402" y="214">show_bag()</text>

<!-- LockedPlace -->
<rect x="70" y="300" width="240" height="150" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text class="th" x="190" y="322" text-anchor="middle">LockedPlace(Place)</text>
<line class="div" x1="70" y1="336" x2="310" y2="336"/>
<text class="ts" x="82" y="360">required_item: Item</text>
<text class="ts" x="82" y="380">unlocked: bool</text>
<line class="div" x1="70" y1="392" x2="310" y2="392"/>
<text class="ts" x="82" y="414">__init__(...) calls super()</text>
<text class="ts" x="82" y="434">visit(player) → bool  [overrides]</text>

<!-- Chest -->
<rect x="390" y="300" width="240" height="150" rx="4" fill="#FAEEDA" stroke="#854F0B"/>
<text class="th" x="510" y="322" text-anchor="middle">Chest</text>
<line class="div" x1="390" y1="336" x2="630" y2="336"/>
<text class="ts" x="402" y="360">required_code: str</text>
<text class="ts" x="402" y="380">opened: bool</text>
<line class="div" x1="390" y1="392" x2="630" y2="392"/>
<text class="ts" x="402" y="414">__init__(required_code)</text>
<text class="ts" x="402" y="434">open(player)</text>

<!-- Item -->
<rect x="390" y="500" width="240" height="110" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text class="th" x="510" y="522" text-anchor="middle">Item</text>
<line class="div" x1="390" y1="536" x2="630" y2="536"/>
<text class="ts" x="402" y="560">name: str</text>
<line class="div" x1="390" y1="572" x2="630" y2="572"/>
<text class="ts" x="402" y="594">__init__(name)</text>

<!-- Inheritance: LockedPlace -> Place (hollow triangle) -->
<polygon points="190,230 181,245 199,245" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="190" y1="245" x2="190" y2="300" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="ts" x="200" y="276">inherits</text>

<!-- Associations -->
<line class="arr" x1="310" y1="200" x2="388" y2="330" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="248">chest</text>

<path class="arr" d="M190 450 V540 H388" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="532">required_item</text>

<path class="arr" d="M70 210 H50 V585 H388" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="577">item</text>

<text class="ts" x="40" y="644">Polymorphism: place.visit(player) runs Place.visit or LockedPlace.visit depending on the object.</text>
<text class="ts" x="40" y="666">Objects: canteen, main_stage = Place · computer_lab = LockedPlace · trophy_chest, key, code, players</text>
</svg>
